server {
    server_name search.hardinai.co.uk;
    client_max_body_size 10M;
    location / {
        proxy_pass http://localhost:5008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 120;
        proxy_send_timeout 120;
        proxy_buffering off;
    }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/search.hardinai.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/search.hardinai.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = search.hardinai.co.uk) {
        return 301 https://$host$request_uri;
    }
    server_name search.hardinai.co.uk;
    listen 80;
    return 404;
}
