[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "area-one-evidence-verifier"
version = "0.1.0"
description = "Offline verification for Area One portable evidence bundles"
readme = {text = "Offline verification for Area One portable evidence bundles.", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = [
  "cryptography==46.0.6",
  "rfc3161ng==2.1.3",
]

[project.scripts]
area-one-verify = "evidence_bundle:main"

[tool.setuptools]
py-modules = [
  "checkpoint_witness",
  "evidence_bundle",
  "issuer_trust",
  "report_file_verifier",
  "report_signature",
  "rfc3161_timestamp",
  "transparency_log",
  "witness_quorum",
]
