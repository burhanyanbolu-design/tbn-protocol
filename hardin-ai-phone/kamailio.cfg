####### Routing Logic ########

# Main SIP request routing logic
request_route {
    # Per request initial checks
    route(REQINIT);

    # NAT detection
    route(NATDETECT);

    # CANCEL processing
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # Handle retransmissions
    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # Record routing for dialog forming requests
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # Handle requests within SIP dialogs
    route(WITHINDLG);

    ### Only initial requests (no To tag)

    # Authentication
    route(AUTH);

    # Handle REGISTER
    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    if ($rU == $null) {
        # Request with no Username in RURI
        sl_send_reply("484", "Address Incomplete");
        exit;
    }

    # Route to Asterisk for call handling
    route(TOASTERISK);
}

# Wrapper for relaying requests
route[RELAY] {
    if (is_method("INVITE|BYE|SUBSCRIBE|UPDATE")) {
        if (!t_is_set("branch_route")) {
            t_on_branch("MANAGE_BRANCH");
        }
    }
    if (is_method("INVITE|SUBSCRIBE|UPDATE")) {
        if (!t_is_set("onreply_route")) {
            t_on_reply("MANAGE_REPLY");
        }
    }
    if (is_method("INVITE")) {
        t_on_failure("MANAGE_FAILURE");
    }
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# Per SIP request initial checks
route[REQINIT] {
    # Max forwards check
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # Sanity check
    if (!sanity_check("17895", "7")) {
        xlog("Malformed SIP request from $si:$sp\n");
        exit;
    }

    # Flood detection - drop if too many requests from same source
    if (src_ip != myself) {
        if ($sht(ipban=>$si) != $null) {
            # IP is already banned
            xdbg("request from banned IP - $rm from $fu (IP:$si:$sp)\n");
            exit;
        }
    }
}

# Handle requests within SIP dialogs
route[WITHINDLG] {
    if (!has_totag()) return;

    if (loose_route()) {
        route(NATMANAGE);
        if (is_method("ACK")) {
            # ACK is forwarded statelessly
            route(NATMANAGE);
        } else if (is_method("NOTIFY")) {
            # Add Record-Route for in-dialog NOTIFY
            record_route();
        }
        route(RELAY);
        exit;
    }

    if (is_method("ACK")) {
        if (t_check_trans()) {
            # No loose-route, but stateful ACK
            route(RELAY);
            exit;
        } else {
            # ACK without matching transaction - ignore
            exit;
        }
    }
    sl_send_reply("404", "Not Here");
    exit;
}

# Handle SIP registrations
route[REGISTRAR] {
    if (!is_method("REGISTER")) return;

    if (isflagset(FLT_NATS)) {
        setbflag(FLT_NATS);
    }

    if (!save("location")) {
        sl_reply_error();
    }
    exit;
}

# Authentication route
route[AUTH] {
    # Don't auth requests from Asterisk (local)
    if (src_ip == 127.0.0.1) {
        return;
    }

    # Don't auth requests from wholesale DID provider
    # (Add your wholesale provider IPs here)
    # if (src_ip == WHOLESALE_PROVIDER_IP) {
    #     return;
    # }

    if (is_method("REGISTER") || from_uri == myself) {
        # Authenticate
        if (!auth_check("$fd", "subscriber", "1")) {
            auth_challenge("$fd", "0");
            exit;
        }
        # User authenticated - remove auth header
        if (!is_method("REGISTER|PUBLISH")) {
            consume_credentials();
        }
    }
    return;
}

# NAT detection
route[NATDETECT] {
    force_rport();
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            if (is_first_hop()) {
                set_contact_alias();
            }
        }
        setflag(FLT_NATS);
    }
    return;
}

# NAT management for signaling and media
route[NATMANAGE] {
    if (is_request()) {
        if (has_totag()) {
            if (check_route_param("nat=yes")) {
                setbflag(FLT_NATS);
            }
        }
    }
    if (!(isflagset(FLT_NATS) || isbflagset(FLT_NATS))) return;

    if (is_request()) {
        if (!has_totag()) {
            if (t_is_branch_route()) {
                add_rr_param(";nat=yes");
            }
        }
    }
    if (is_reply()) {
        if (isbflagset(FLT_NATS)) {
            if (is_first_hop()) {
                set_contact_alias();
            }
        }
    }
    return;
}

# Route calls to Asterisk
route[TOASTERISK] {
    # Send all calls to local Asterisk instance
    $du = "sip:" + ASTERISK_IP + ":" + ASTERISK_PORT;
    route(RELAY);
    exit;
}

# Manage outgoing branches
branch_route[MANAGE_BRANCH] {
    xdbg("new branch [$T_branch_idx] to $ru\n");
    route(NATMANAGE);
}

# Manage incoming replies
onreply_route[MANAGE_REPLY] {
    xdbg("incoming reply\n");
    if (status =~ "[12][0-9][0-9]") {
        route(NATMANAGE);
    }
}

# Manage failure routing cases
failure_route[MANAGE_FAILURE] {
    route(NATMANAGE);
    if (t_is_canceled()) exit;
}
