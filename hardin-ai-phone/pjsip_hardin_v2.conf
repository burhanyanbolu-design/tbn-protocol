; Hardin-AI Phone — Asterisk PJSIP Configuration
; Asterisk listens on port 5080, Kamailio on 5060

[transport-udp-5080]
type=transport
protocol=udp
bind=0.0.0.0:5080
external_media_address=3.11.229.68
external_signaling_address=3.11.229.68
local_net=172.26.0.0/16
local_net=127.0.0.0/8
local_net=172.17.0.0/16

; Kamailio as a trusted peer (no auth needed from Kamailio)
[kamailio]
type=endpoint
transport=transport-udp-5080
context=from-kamailio
disallow=all
allow=alaw
allow=ulaw
allow=gsm
direct_media=no
trust_id_inbound=yes
trust_id_outbound=yes

[kamailio-identify]
type=identify
endpoint=kamailio
match=127.0.0.1

[kamailio-aor]
type=aor
max_contacts=1
contact=sip:127.0.0.1:5060
