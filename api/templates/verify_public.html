<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBN Protocol — Public Verification Registry</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EF6RKG8KY2"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-EF6RKG8KY2');</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #58a6ff; font-size: 1.8rem; margin-bottom: 8px; }
        .header p { color: #8b949e; font-size: 1rem; }
        .search-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 1rem;
            font-family: monospace;
            margin-bottom: 12px;
        }
        .search-box input:focus { outline: none; border-color: #58a6ff; }
        .search-box button {
            width: 100%;
            padding: 12px;
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .search-box button:hover { background: #2ea043; }
        .result {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            display: none;
        }
        .result.show { display: block; }
        .result-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #21262d;
        }
        .status-icon { font-size: 2rem; }
        .result-header h2 { color: #c9d1d9; font-size: 1.2rem; }
        .result-header .cert-level {
            margin-left: auto;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .level-platinum { background: #e5e5e522; color: #e5e5e5; border: 1px solid #e5e5e5; }
        .level-gold { background: #d2992222; color: #d29922; border: 1px solid #d29922; }
        .level-silver { background: #8b949e22; color: #8b949e; border: 1px solid #8b949e; }
        .level-bronze { background: #da6d2522; color: #da6d25; border: 1px solid #da6d25; }
        .level-standard { background: #1f6feb22; color: #58a6ff; border: 1px solid #58a6ff; }
        .level-community { background: #23863622; color: #3fb950; border: 1px solid #3fb950; }
        .level-none { background: #30363d; color: #8b949e; border: 1px solid #484f58; }
        .score-bar {
            margin: 16px 0;
            background: #21262d;
            border-radius: 8px;
            height: 24px;
            overflow: hidden;
            position: relative;
        }
        .score-fill {
            height: 100%;
            border-radius: 8px;
            transition: width 0.5s;
        }
        .score-fill.high { background: #3fb950; }
        .score-fill.medium { background: #d29922; }
        .score-fill.low { background: #f85149; }
        .score-label {
            position: absolute;
            right: 8px;
            top: 3px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
        }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        .detail-item {
            background: #0d1117;
            padding: 12px;
            border-radius: 8px;
        }
        .detail-item .label { color: #8b949e; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 4px; }
        .detail-item .value { color: #c9d1d9; font-size: 0.9rem; font-weight: 600; }
        .detail-item .value.valid { color: #3fb950; }
        .detail-item .value.invalid { color: #f85149; }
        .detail-item .value.warning { color: #d29922; }
        .mfc-section { margin-top: 20px; }
        .mfc-section h3 { color: #8b949e; font-size: 0.85rem; margin-bottom: 8px; }
        .mfc-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 0.85rem;
        }
        .mfc-pass { color: #3fb950; }
        .mfc-fail { color: #f85149; }
        .framework-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid #21262d; }
        .framework-section h3 { color: #8b949e; font-size: 0.85rem; margin-bottom: 8px; }
        .framework-badges { display: flex; flex-wrap: wrap; gap: 6px; }
        .fw-badge {
            padding: 3px 8px;
            background: #1f6feb11;
            border: 1px solid #1f6feb44;
            border-radius: 4px;
            font-size: 0.7rem;
            color: #58a6ff;
        }
        .not-found {
            text-align: center;
            padding: 40px;
            color: #f85149;
        }
        .footer { text-align: center; margin-top: 40px; color: #484f58; font-size: 0.8rem; }
        .footer a { color: #58a6ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 TBN Verification Registry</h1>
            <p>Check if an AI agent is certified in the TBN Protocol trust network</p>
        </div>

        <div class="search-box">
            <input type="text" id="agent-id" placeholder="Enter agent ID (e.g. tbn-bot-958e4d03d1b32ea3)" />
            <button onclick="verify()">Verify Agent</button>
        </div>

        <div class="result" id="result"></div>

        <div class="footer">
            <p>TBN Protocol — Hardin Enterprises Ltd © 2026<br>
            <a href="https://tbn.hardinai.co.uk">Dashboard</a> · <a href="/partners">Partner Registration</a> · <a href="https://github.com/burhanyanbolu-design/tbn-protocol">GitHub</a></p>
        </div>
    </div>

    <script>
        async function verify() {
            const agentId = document.getElementById('agent-id').value.trim();
            const resultDiv = document.getElementById('result');

            if (!agentId) {
                resultDiv.innerHTML = '<div class="not-found">Please enter an agent ID</div>';
                resultDiv.classList.add('show');
                return;
            }

            try {
                const res = await fetch('/api/verify/public', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agent_id: agentId })
                });

                const data = await res.json();

                if (data.certification_status === 'UNKNOWN') {
                    resultDiv.innerHTML = `
                        <div class="not-found">
                            <div style="font-size:2rem;margin-bottom:12px;">❌</div>
                            <h2>Agent Not Found</h2>
                            <p style="color:#8b949e;margin-top:8px;">No certification record exists for <code>${agentId}</code></p>
                        </div>`;
                } else {
                    const score = data.certification_score || 0;
                    const scoreClass = score >= 80 ? 'high' : score >= 60 ? 'medium' : 'low';
                    const levelClass = data.cert_level ? 'level-' + data.cert_level.toLowerCase() : 'level-none';

                    resultDiv.innerHTML = `
                        <div class="result-header">
                            <span class="status-icon">${data.certification_status === 'VALID' ? '✅' : data.certification_status === 'REVOKED' ? '🔴' : '⚠️'}</span>
                            <div>
                                <h2>${data.agent_name || agentId}</h2>
                                <span style="color:#8b949e;font-size:0.8rem;">${agentId}</span>
                            </div>
                            <span class="cert-level ${levelClass}">${data.cert_level}</span>
                        </div>

                        <div class="score-bar">
                            <div class="score-fill ${scoreClass}" style="width:${score}%"></div>
                            <span class="score-label">${score}/100</span>
                        </div>

                        <div class="details-grid">
                            <div class="detail-item">
                                <div class="label">Certification</div>
                                <div class="value ${data.certification_status === 'VALID' ? 'valid' : 'invalid'}">${data.certification_status}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Attestation</div>
                                <div class="value ${data.attestation_status === 'MATCHED' ? 'valid' : data.attestation_status === 'MISMATCH' ? 'invalid' : 'warning'}">${data.attestation_status}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Policy Status</div>
                                <div class="value ${data.policy_status === 'COMPLIANT' ? 'valid' : data.policy_status === 'DRIFTED' ? 'warning' : 'invalid'}">${data.policy_status}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Budget Status</div>
                                <div class="value ${data.budget_status === 'WITHIN_LIMITS' ? 'valid' : data.budget_status === 'NO_BUDGET' ? 'warning' : 'invalid'}">${data.budget_status}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Within Bounds</div>
                                <div class="value ${data.within_bounds ? 'valid' : 'invalid'}">${data.within_bounds ? 'YES' : 'NO'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Violations</div>
                                <div class="value ${data.violations === 0 ? 'valid' : 'invalid'}">${data.violations}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Last Tested</div>
                                <div class="value">${data.last_tested ? new Date(data.last_tested).toLocaleDateString() : 'N/A'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Verified At</div>
                                <div class="value">${new Date(data.verification_time).toLocaleString()}</div>
                            </div>
                        </div>

                        <div class="mfc-section">
                            <h3>Mandatory Failure Conditions</h3>
                            ${(data.mfc_results || []).map(mfc => `
                                <div class="mfc-item ${mfc.passed ? 'mfc-pass' : 'mfc-fail'}">
                                    ${mfc.passed ? '✓' : '✗'} ${mfc.name}
                                </div>
                            `).join('')}
                        </div>

                        <div class="framework-section">
                            <h3>Regulatory Framework Coverage</h3>
                            <div class="framework-badges">
                                <span class="fw-badge">EU AI Act Art. 9</span>
                                <span class="fw-badge">EU AI Act Art. 14</span>
                                <span class="fw-badge">EU AI Act Art. 61</span>
                                <span class="fw-badge">UK GDPR</span>
                            </div>
                        </div>
                    `;
                }

                resultDiv.classList.add('show');
            } catch (err) {
                resultDiv.innerHTML = '<div class="not-found">Error connecting to verification service</div>';
                resultDiv.classList.add('show');
            }
        }

        // Allow Enter key
        document.getElementById('agent-id').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verify();
        });
    </script>
</body>
</html>
