<!DOCTYPE html>
<html>
<head>
<title>TBN Bot Icons</title>
<style>
body { background: #0a0e1a; color: #fff; font-family: sans-serif; padding: 40px; }
h1 { color: #58a6ff; margin-bottom: 30px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 24px; }
.icon-card { text-align: center; }
.icon-card img { width: 100px; height: 100px; }
.icon-card p { margin-top: 8px; font-size: 13px; color: #888; }
</style>
</head>
<body>
<h1>TBN Bot Icons</h1>
<div class="grid">
  <div class="icon-card"><img src="hardin.svg"><p>Hardin (Main)</p></div>
  <div class="icon-card"><img src="tbn-default.svg"><p>TBN Default</p></div>
  <div class="icon-card"><img src="search.svg"><p>Search Bot</p></div>
  <div class="icon-card"><img src="validator.svg"><p>Validator Bot</p></div>
  <div class="icon-card"><img src="connector.svg"><p>Connector Bot</p></div>
  <div class="icon-card"><img src="messenger.svg"><p>Messenger Bot</p></div>
  <div class="icon-card"><img src="philosophy.svg"><p>Philosophy/Wisdom Bot</p></div>
</div>
</body>
</html>
