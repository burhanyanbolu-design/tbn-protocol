<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  
  <!-- Badge background -->
  <rect width="200" height="60" rx="8" fill="url(#badge-bg)" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- Shield -->
  <g transform="translate(12, 10)">
    <path d="M20 3 L37 10 L37 22 C37 34 28 42 20 46 C12 42 3 34 3 22 L3 10 Z" 
          fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="20" y="28" text-anchor="middle" font-size="16" fill="#3fb950">✓</text>
  </g>
  
  <!-- Text -->
  <text x="58" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">TBN VERIFIED</text>
  <text x="58" y="42" font-family="-apple-system, sans-serif" font-size="9" fill="#8b949e">Agent Trust Certified</text>
  
  <!-- Status dot -->
  <circle cx="180" cy="30" r="5" fill="#3fb950"/>
</svg>
