    <path d="M60 30 L95 45 L95 72 C95 100 78 120 60 132 C42 120 25 100 25 72 L25 45 Z" 
          fill="#58a6ff" fill-opacity="0.1" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="60" y="85" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#3fb950">✓</text>
  </g>
  
  <!-- Main text -->
  <text x="240" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#ffffff">TBN Protocol</text>
  <text x="240" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#8b949e">Trust Infrastructure for AI Agents</text>
  
  <!-- Feature pills -->
  <g transform="translate(240, 330)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-width="1"/>
    <text x="90" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#58a6ff">🔐 Certification</text>
    
    <rect x="195" y="0" width="180" height="36" rx="18" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="1"/>
    <text x="285" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#3fb950">🛡️ Attestation</text>
    
    <rect x="390" y="0" width="180" height="36" rx="18" fill="#d29922" fill-opacity="0.15" stroke="#d29922" stroke-width="1"/>
    <text x="480" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#d29922">📊 Compliance</text>
    
    <rect x="585" y="0" width="180" height="36" rx="18" fill="#f85149" fill-opacity="0.15" stroke="#f85149" stroke-width="1"/>
    <text x="675" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#f85149">💰 Budget Control</text>
  </g>
  
  <!-- Connection diagram -->
