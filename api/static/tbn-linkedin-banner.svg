    <rect x="0" y="0" width="140" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="70" y="30" text-anchor="middle" font-family="monospace" font-size="12" fill="#c9d1d9">AI Agent</text>
    
    <line x1="155" y1="25" x2="225" y2="25" stroke="#3fb950" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="220,20 230,25 220,30" fill="#3fb950"/>
    
    <rect x="235" y="0" width="140" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="305" y="30" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#58a6ff">TBN Verify</text>
    
    <line x1="390" y1="25" x2="460" y2="25" stroke="#3fb950" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="455,20 465,25 455,30" fill="#3fb950"/>
    
    <rect x="470" y="0" width="180" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="560" y="30" text-anchor="middle" font-family="monospace" font-size="12" fill="#c9d1d9">Governance System</text>
  </g>
  
  <!-- Bottom bar -->
