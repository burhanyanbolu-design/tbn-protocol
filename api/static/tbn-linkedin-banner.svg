<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="628" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#58a6ff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="628" stroke="#58a6ff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="628" stroke="#58a6ff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="628" stroke="#58a6ff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="628" stroke="#58a6ff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="628" stroke="#58a6ff" stroke-width="1"/>
