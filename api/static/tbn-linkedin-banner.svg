  <text x="100" y="580" font-family="monospace" font-size="14" fill="#8b949e">tbn.hardinai.co.uk</text>
  <text x="100" y="605" font-family="monospace" font-size="12" fill="#484f58">Hardin AI Solutions — Hardin Enterprises Ltd</text>
  
  <text x="1100" y="580" text-anchor="end" font-family="monospace" font-size="14" fill="#58a6ff">pip install tbn-protocol</text>
  <text x="1100" y="605" text-anchor="end" font-family="monospace" font-size="12" fill="#484f58">AGPL-3.0 | Commercial licensing available</text>
  
  <!-- Accent line bottom -->
  <rect x="0" y="624" width="1200" height="4" fill="url(#accent)"/>
