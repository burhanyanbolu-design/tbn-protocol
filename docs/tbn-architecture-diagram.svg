<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="900" fill="#0a0e1a"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2040" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="tbnGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">TBN PROTOCOL — AI Agent Governance Architecture</text>
  <text x="600" y="78" text-anchor="middle" fill="#8b949e" font-size="14">The Trust Infrastructure Layer for Autonomous AI Systems</text>
  
  <!-- === LAYER 0: AI AGENTS (Top) === -->
  <rect x="50" y="100" width="1100" height="120" rx="12" fill="#1a1a2e" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="125" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="1">LAYER 0 — AI AGENTS &amp; FRAMEWORKS</text>
  
  <!-- Agent boxes -->
  <rect x="80" y="140" width="150" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="155" y="165" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="600">Salesforce Agents</text>
  <text x="155" y="183" text-anchor="middle" fill="#8b949e" font-size="10">CRM Automation</text>
  
  <rect x="250" y="140" width="150" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="325" y="165" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="600">LangChain Agents</text>
  <text x="325" y="183" text-anchor="middle" fill="#8b949e" font-size="10">LLM Orchestration</text>
  
  <rect x="420" y="140" width="150" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="495" y="165" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="600">AutoGPT / CrewAI</text>
  <text x="495" y="183" text-anchor="middle" fill="#8b949e" font-size="10">Autonomous Tasks</text>
  
  <rect x="590" y="140" width="150" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="665" y="165" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="600">Custom Agents</text>
  <text x="665" y="183" text-anchor="middle" fill="#8b949e" font-size="10">Enterprise Bots</text>
  
  <rect x="760" y="140" width="150" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="835" y="165" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="600">Microsoft Copilot</text>
  <text x="835" y="183" text-anchor="middle" fill="#8b949e" font-size="10">Office Automation</text>
  
  <rect x="930" y="140" width="150" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="1005" y="165" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="600">Google A2A</text>
  <text x="1005" y="183" text-anchor="middle" fill="#8b949e" font-size="10">Agent-to-Agent</text>

  <!-- Arrow down -->
  <path d="M 600 220 L 600 245" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/></marker></defs>
  
  <!-- === TBN PROTOCOL CORE (Center - THE BOSS) === -->
  <rect x="50" y="250" width="1100" height="380" rx="16" fill="url(#tbnGlow)" stroke="url(#headerGrad)" stroke-width="2"/>
  
  <!-- TBN Header -->
  <rect x="350" y="235" width="500" height="35" rx="17" fill="#0a0e1a" stroke="url(#headerGrad)" stroke-width="2"/>
  <text x="600" y="258" text-anchor="middle" fill="#00d4ff" font-size="16" font-weight="700" filter="url(#glow)">⬡ TBN PROTOCOL — GOVERNANCE CONTROL PLANE ⬡</text>
  
  <!-- Layer 1: Identity -->
  <rect x="80" y="285" width="340" height="160" rx="10" fill="#0d1117" stroke="#00d4ff" stroke-width="1.5"/>
  <rect x="80" y="285" width="340" height="30" rx="10" fill="#00d4ff" fill-opacity="0.15"/>
  <text x="250" y="305" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="700">LAYER 1 — IDENTITY &amp; ATTESTATION</text>
  
  <text x="100" y="335" fill="#e0e0e0" font-size="12">🔑 Cryptographic Agent Identity (Ed25519)</text>
  <text x="100" y="358" fill="#e0e0e0" font-size="12">📜 TBN Certificate Issuance</text>
  <text x="100" y="381" fill="#e0e0e0" font-size="12">🔐 Agent Registration &amp; Verification</text>
  <text x="100" y="404" fill="#e0e0e0" font-size="12">🏷️ Pedigree Chain (Agent Lineage)</text>
  <text x="100" y="427" fill="#e0e0e0" font-size="12">✅ Trust Score Computation</text>
  
  <!-- Layer 2: Governance -->
  <rect x="440" y="285" width="340" height="160" rx="10" fill="#0d1117" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="440" y="285" width="340" height="30" rx="10" fill="#7c3aed" fill-opacity="0.15"/>
  <text x="610" y="305" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">LAYER 2 — GOVERNANCE &amp; ENFORCEMENT</text>
  
  <text x="460" y="335" fill="#e0e0e0" font-size="12">⚖️ Runtime Policy Engine (ALLOW/DENY)</text>
  <text x="460" y="358" fill="#e0e0e0" font-size="12">🚨 Violation Detection &amp; Alerting</text>
  <text x="460" y="381" fill="#e0e0e0" font-size="12">📋 Policy-as-Code Rules</text>
  <text x="460" y="404" fill="#e0e0e0" font-size="12">🔄 Compliance Drift Monitoring</text>
  <text x="460" y="427" fill="#e0e0e0" font-size="12">🛡️ Budget &amp; Scope Enforcement</text>
  
  <!-- Layer 3: Audit -->
  <rect x="800" y="285" width="320" height="160" rx="10" fill="#0d1117" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="800" y="285" width="320" height="30" rx="10" fill="#22c55e" fill-opacity="0.15"/>
  <text x="960" y="305" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="700">LAYER 3 — AUDIT &amp; OBSERVABILITY</text>
  
  <text x="820" y="335" fill="#e0e0e0" font-size="12">📊 Immutable Trust Ledger</text>
  <text x="820" y="358" fill="#e0e0e0" font-size="12">🔍 Action-Level Logging</text>
  <text x="820" y="381" fill="#e0e0e0" font-size="12">📈 Behavioural Analytics</text>
  <text x="820" y="404" fill="#e0e0e0" font-size="12">🏛️ Regulatory Reports (EU AI Act)</text>
  <text x="820" y="427" fill="#e0e0e0" font-size="12">⚡ Real-time Anomaly Detection</text>

  <!-- Governance Flow (center) -->
  <rect x="180" y="465" width="840" height="80" rx="10" fill="#0d1117" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="600" y="490" text-anchor="middle" fill="#ff6b35" font-size="13" font-weight="700">GOVERNANCE DECISION FLOW</text>
  
  <!-- Flow steps -->
  <rect x="200" y="500" width="130" height="35" rx="6" fill="#1a1a2e" stroke="#00d4ff" stroke-width="1"/>
  <text x="265" y="522" text-anchor="middle" fill="#00d4ff" font-size="11" font-weight="600">① IDENTIFY</text>
  
  <path d="M 335 517 L 365 517" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
  <defs><marker id="arrowhead2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b949e"/></marker></defs>
  
  <rect x="370" y="500" width="130" height="35" rx="6" fill="#1a1a2e" stroke="#7c3aed" stroke-width="1"/>
  <text x="435" y="522" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">② EVALUATE</text>
  
  <path d="M 505 517 L 535 517" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
  
  <rect x="540" y="500" width="130" height="35" rx="6" fill="#1a1a2e" stroke="#ff6b35" stroke-width="1"/>
  <text x="605" y="522" text-anchor="middle" fill="#ff6b35" font-size="11" font-weight="600">③ ENFORCE</text>
  
  <path d="M 675 517 L 705 517" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
  
  <rect x="710" y="500" width="130" height="35" rx="6" fill="#1a1a2e" stroke="#22c55e" stroke-width="1"/>
  <text x="775" y="522" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">④ RECORD</text>
  
  <path d="M 845 517 L 875 517" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
  
  <rect x="880" y="500" width="130" height="35" rx="6" fill="#1a1a2e" stroke="#fbbf24" stroke-width="1"/>
  <text x="945" y="522" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">⑤ REPORT</text>

  <!-- Decision outcomes -->
  <rect x="80" y="560" width="160" height="50" rx="8" fill="#0d1117" stroke="#22c55e" stroke-width="1.5"/>
  <text x="160" y="582" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="700">✓ ALLOW</text>
  <text x="160" y="600" text-anchor="middle" fill="#8b949e" font-size="10">Action proceeds</text>
  
  <rect x="260" y="560" width="160" height="50" rx="8" fill="#0d1117" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="582" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">⚠ ESCALATE</text>
  <text x="340" y="600" text-anchor="middle" fill="#8b949e" font-size="10">Human review required</text>
  
  <rect x="440" y="560" width="160" height="50" rx="8" fill="#0d1117" stroke="#ef4444" stroke-width="1.5"/>
  <text x="520" y="582" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="700">✗ DENY</text>
  <text x="520" y="600" text-anchor="middle" fill="#8b949e" font-size="10">Action blocked</text>
  
  <rect x="620" y="560" width="160" height="50" rx="8" fill="#0d1117" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="700" y="582" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">🔔 VIOLATION</text>
  <text x="700" y="600" text-anchor="middle" fill="#8b949e" font-size="10">Rule breach logged</text>
  
  <rect x="800" y="560" width="160" height="50" rx="8" fill="#0d1117" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="880" y="582" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="700">📊 AUDIT</text>
  <text x="880" y="600" text-anchor="middle" fill="#8b949e" font-size="10">Immutable record</text>
  
  <rect x="980" y="560" width="160" height="50" rx="8" fill="#0d1117" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="1060" y="582" text-anchor="middle" fill="#ff6b35" font-size="14" font-weight="700">🏛️ COMPLY</text>
  <text x="1060" y="600" text-anchor="middle" fill="#8b949e" font-size="10">EU AI Act / GDPR</text>

  <!-- === LAYER 4: Compliance & Integrations (Bottom) === -->
  <rect x="50" y="650" width="1100" height="100" rx="12" fill="#1a1a2e" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="675" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="1">LAYER 4 — COMPLIANCE FRAMEWORKS &amp; INTEGRATIONS</text>
  
  <rect x="80" y="690" width="140" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="150" y="717" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">EU AI Act</text>
  
  <rect x="235" y="690" width="140" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="305" y="717" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">GDPR</text>
  
  <rect x="390" y="690" width="140" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="460" y="717" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">ISO 42001</text>
  
  <rect x="545" y="690" width="140" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="615" y="717" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">NIST AI RMF</text>
  
  <rect x="700" y="690" width="140" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="770" y="717" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">FCA / NHS</text>
  
  <rect x="855" y="690" width="140" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="925" y="717" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">SOC 2</text>
  
  <rect x="1010" y="690" width="140" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="1080" y="717" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">Custom Rules</text>

  <!-- Footer -->
  <text x="600" y="790" text-anchor="middle" fill="#00d4ff" font-size="16" font-weight="700" filter="url(#glow)">tbn.hardinai.co.uk</text>
  <text x="600" y="815" text-anchor="middle" fill="#8b949e" font-size="12">Open Protocol • PyPI: pip install tbn-protocol • AGPL-3.0 • Live &amp; Operational</text>
  
  <!-- Bottom tagline -->
  <rect x="300" y="835" width="600" height="40" rx="8" fill="#0d1117" stroke="url(#headerGrad)" stroke-width="1"/>
  <text x="600" y="860" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">"You cannot govern what you cannot identify. You cannot enforce what you cannot observe."</text>

</svg>