<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBN Protocol — The Trust Identity Layer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden;height:100vh;display:flex;flex-direction:column}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.particle{position:absolute;width:2px;height:2px;background:rgba(0,212,255,0.3);border-radius:50%;animation:drift 10s infinite linear}
@keyframes drift{0%{transform:translateY(100vh);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="page">
</div>
</body>
</html>
